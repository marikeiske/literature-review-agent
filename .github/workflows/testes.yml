# Roda a cada envio: testes, lint e auditoria de dependências.
# Não precisa do corpus nem de chaves: os testes usam páginas de exemplo.
name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    # ubuntu-latest passou a ser 26.04 em 05/11/2026, e o Playwright 1.56 não instala o Chromium nele
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependências
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Lint (ruff)
        run: ruff check .
      - name: Testes (pytest, inclusive interface com Playwright)
        run: pytest -q
      - name: Auditoria de dependências (pip-audit)
        run: pip-audit -r requirements.txt
